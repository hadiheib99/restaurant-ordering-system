<main class="register-page">
  <section class="register-card">
    <a class="back-link" href="/login">← Back to sign in</a>

    <h1>Create Customer Account</h1>
    <p>Register your account and start ordering.</p>

    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="name-grid">
        <label>
          First name
          <input type="text" formControlName="firstName" autocomplete="given-name">
          @if (registerForm.controls.firstName.touched && registerForm.controls.firstName.hasError('required')) {
            <small class="field-error">First name is required.</small>
          }
        </label>
        <label>
          Last name
          <input type="text" formControlName="lastName" autocomplete="family-name">
          @if (registerForm.controls.lastName.touched && registerForm.controls.lastName.hasError('required')) {
            <small class="field-error">Last name is required.</small>
          }
        </label>
      </div>

      <label>
        Username
        <input type="text" formControlName="username" autocomplete="username">
        @if (registerForm.controls.username.touched && registerForm.controls.username.hasError('required')) {
          <small class="field-error">Username is required.</small>
        } @else if (registerForm.controls.username.touched && registerForm.controls.username.hasError('minlength')) {
          <small class="field-error">Username must contain at least 3 characters.</small>
        }
      </label>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email">
        @if (registerForm.controls.email.touched && registerForm.controls.email.hasError('required')) {
          <small class="field-error">Email is required.</small>
        } @else if (registerForm.controls.email.touched && registerForm.controls.email.hasError('email')) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </label>

      <label>
        Phone number
        <input type="tel" formControlName="phone" autocomplete="tel" placeholder="0501234567">
        @if (registerForm.controls.phone.touched && registerForm.controls.phone.hasError('required')) {
          <small class="field-error">Phone number is required.</small>
        }
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password">
        <small>At least 8 characters.</small>
        @if (registerForm.controls.password.touched && registerForm.controls.password.hasError('required')) {
          <small class="field-error">Password is required.</small>
        } @else if (registerForm.controls.password.touched && registerForm.controls.password.hasError('minlength')) {
          <small class="field-error">Password must contain at least 8 characters.</small>
        }
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>
  </section>
</main>
