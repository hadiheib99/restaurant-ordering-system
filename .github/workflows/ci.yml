name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile backend
        run: bash ./mvnw -DskipTests compile

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

  smoke-test:
    name: Backend smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: restaurant_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      artemis:
        image: apache/activemq-artemis:latest-alpine
        env:
          ARTEMIS_USER: admin
          ARTEMIS_PASSWORD: admin
        ports:
          - 61616:61616
          - 8161:8161

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start backend
        run: |
          bash ./mvnw spring-boot:run > /tmp/restaurant-app.log 2>&1 &
          echo $! > /tmp/restaurant-app.pid

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/meals > /tmp/meals.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/restaurant-app.log
          exit 1

      - name: Authenticate seeded customer
        run: |
          status=$(curl -sS -o /tmp/login.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"email":"customer1@restaurant.com","password":"Customer123"}' \
            http://localhost:8080/api/auth/login)
          test "$status" = "200"
          token=$(jq -r '.token' /tmp/login.json)
          test -n "$token"
          test "$token" != "null"
          echo "CUSTOMER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify current user and create order
        run: |
          curl -fsS \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" \
            http://localhost:8080/api/auth/me > /tmp/me.json

          customer_id=$(jq -r '.id' /tmp/me.json)
          meal_id=$(jq -r '.[0].id' /tmp/meals.json)
          test -n "$customer_id"
          test -n "$meal_id"

          status=$(curl -sS -o /tmp/order.json -w "%{http_code}" \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"customerId\":$customer_id,\"items\":[{\"mealId\":$meal_id,\"quantity\":1}]}" \
            http://localhost:8080/api/orders)

          test "$status" = "201"
          test "$(jq -r '.status' /tmp/order.json)" = "NEW"

      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/restaurant-app.log || true
