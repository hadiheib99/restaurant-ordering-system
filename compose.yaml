services:
  postgres:
    image: postgres:18-alpine
    container_name: restaurant-db
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or run bash start.sh}"
    ports:
      - "5432:5432"
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: restaurant-artemis
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD:?Set ARTEMIS_PASSWORD or run bash start.sh}"
    ports:
      - "61616:61616"
      - "8161:8161"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/restaurant_db
      DB_USERNAME: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or run bash start.sh}"
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD:?Set ARTEMIS_PASSWORD or run bash start.sh}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET or run bash start.sh}"
      APP_SEED_DATA: "${APP_SEED_DATA:-false}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      SEED_WAITER_PASSWORD: "${SEED_WAITER_PASSWORD:-}"
      SEED_CUSTOMER_PASSWORD: "${SEED_CUSTOMER_PASSWORD:-}"
      SEED_CHEF_PASSWORD: "${SEED_CHEF_PASSWORD:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  restaurant_postgres_data:
