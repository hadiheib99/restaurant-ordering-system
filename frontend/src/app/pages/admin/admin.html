<main class="admin-page">
  <header>
    <div>
      <h1>Admin Dashboard</h1>
      <p>Manage the restaurant system</p>
    </div>
    <button type="button" (click)="logout()">Logout</button>
  </header>

  <section class="dashboard-grid">
    <a routerLink="/admin/meals" class="dashboard-card">
      <h2>Meals</h2>
      <p>Add, edit and manage menu items.</p>
    </a>

    <a routerLink="/admin/categories" class="dashboard-card">
      <h2>Categories</h2>
      <p>Manage food categories.</p>
    </a>

    <a routerLink="/admin/users" class="dashboard-card">
      <h2>Users</h2>
      <p>Manage customers, waiters, chefs and admins.</p>
    </a>

    <a routerLink="/orders" class="dashboard-card">
      <h2>Orders</h2>
      <p>View and manage restaurant orders.</p>
    </a>
  </section>
</main>
