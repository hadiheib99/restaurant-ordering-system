spring.application.name=restaurant-ordering-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:admin}

jwt.issuer=${JWT_ISSUER:restaurant-ordering-system}
jwt.secret=${JWT_SECRET:ChangeThisToAVeryLongRandomSecretKeyWithAtLeast32Characters}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
